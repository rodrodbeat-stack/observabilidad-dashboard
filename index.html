<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Observabilidad Total</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .log-entry { font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-cyan-400">📊 OBSERVA-X</h1>
            <div class="flex items-center space-x-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-500/20 text-green-400 animate-pulse">
                    ● Sistema Online
                </span>
                <span id="time-sync" class="text-sm text-gray-400">Sincronizando...</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <section class="lg:col-span-2 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-sm">
                    <h3 class="text-sm font-medium text-gray-400">CPU Usage</h3>
                    <p id="cpu-text" class="text-2xl font-bold text-cyan-400 mt-2">0%</p>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-sm">
                    <h3 class="text-sm font-medium text-gray-400">RAM Usage</h3>
                    <p id="ram-text" class="text-2xl font-bold text-purple-400 mt-2">0%</p>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-sm">
                    <h3 class="text-sm font-medium text-gray-400">Latencia de Red</h3>
                    <p id="latency-text" class="text-2xl font-bold text-emerald-400 mt-2">0ms</p>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 text-gray-200">Métricas de Infraestructura (Live)</h2>
                <div class="h-64 relative">
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>
        </section>

        <section class="space-y-6 flex flex-col h-full">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex-grow flex flex-col shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-200">Consola de Logs (Múltiples Servicios)</h2>
                    <span class="text-xs text-gray-400 bg-gray-700 px-2 py-1 rounded">Stdout</span>
                </div>
                <div id="log-container" class="bg-black text-green-400 p-4 rounded-lg flex-grow overflow-y-auto max-h-[220px] text-xs space-y-1.5 scrollbar-thin">
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-sm">
                <h2 class="text-lg font-semibold mb-3 text-gray-200">Trazas Distribuidas Recientes (Spans)</h2>
                <div id="trace-container" class="space-y-3">
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 p-4 text-center text-xs text-gray-500">
        Dashboard de Observabilidad creado con propósitos de simulación y testing UI.
    </footer>

    <script>
        setInterval(() => {
            document.getElementById('time-sync').innerText = "Última sincronización: " + new Date().toLocaleTimeString();
        }, 1000);

        const ctx = document.getElementById('metricsChart').getContext('2d');
        const labels = Array(15).fill('');
        const cpuData = Array(15).fill(0);
        const ramData = Array(15).fill(0);

        const metricsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'CPU (%)', data: cpuData, borderColor: '#22d3ee', backgroundColor: 'rgba(34,211,238,0.1)', fill: true, tension: 0.3 },
                    { label: 'RAM (%)', data: ramData, borderColor: '#c084fc', backgroundColor: 'rgba(192,132,252,0.1)', fill: true, tension: 0.3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { display: false }, ticks: { display: false } },
                    y: { min: 0, max: 100, grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
                },
                plugins: { legend: { labels: { color: '#f3f4f6' } } }
            }
        });

        const services = ['auth-service', 'payment-gateway', 'user-api', 'inventory-worker'];
        const logLevels = ['INFO', 'INFO', 'WARN', 'ERROR'];
        const messages = {
            'INFO': ['Petición procesada exitosamente', 'Conexión a Base de Datos activa', 'Cache HIT en llave: user_session'],
            'WARN': ['Latencia elevada en query SQL', 'Conexión intermitente con API externa', 'Uso de memoria excedió 75%'],
            'ERROR': ['Token inválido proporcionado por cliente', 'Fallo al procesar pago: Transacción rechazada', 'Error de timeout en servicio interno']
        };

        function addLog() {
            const container = document.getElementById('log-container');
            if(!container) return;
            const service = services[Math.floor(Math.random() * services.length)];
            const level = logLevels[Math.floor(Math.random() * logLevels.length)];
            const msgList = messages[level];
            const msg = msgList[Math.floor(Math.random() * msgList.length)];
            const time = new Date().toISOString().substring(11, 19);

            let colorClass = 'text-green-400';
            if (level === 'WARN') colorClass = 'text-yellow-400';
            if (level === 'ERROR') colorClass = 'text-red-400';

            const logHtml = `<div class="log-entry"><span class="text-gray-500">[${time}]</span> <span class="${colorClass} font-bold">[${level}]</span> <span class="text-cyan-300">[${service}]</span>: ${msg}</div>`;
            container.insertAdjacentHTML('beforeend', logHtml);
            container.scrollTop = container.scrollHeight;

            if (container.children.length > 50) container.removeChild(container.firstChild);
        }

        function updateTraces() {
            const container = document.getElementById('trace-container');
            if(!container) return;
            const traceRoutes = ['GET /api/v1/users', 'POST /checkout/buy', 'GET /products/search'];
            const chosenRoute = traceRoutes[Math.floor(Math.random() * traceRoutes.length)];
            const duration = Math.floor(Math.random() * 400) + 50; 
            
            let statusColor = 'bg-emerald-500';
            if(duration > 350) statusColor = 'bg-red-500';
            else if(duration > 220) statusColor = 'bg-yellow-500';

            const traceHtml = `
                <div class="p-3 bg-gray-900 rounded-lg text-xs space-y-1 border-l-4 border-cyan-500 transition-all duration-300">
                    <div class="flex justify-between font-medium">
                        <span class="text-gray-200">${chosenRoute}</span>
                        <span class="text-gray-400">${duration}ms</span>
                    </div>
                    <div class="w-full bg-gray-700 h-1.5 rounded-full overflow-hidden">
                        <div class="${statusColor} h-1.5 rounded-full" style="width: ${Math.min((duration/450)*100, 100)}%"></div>
                    </div>
                </div>`;
            
            container.insertAdjacentHTML('afterbegin', traceHtml);
            if (container.children.length > 3) container.removeChild(container.lastChild);
        }

        setInterval(() => {
            const currentCpu = Math.floor(Math.random() * 40) + 20; 
            const currentRam = Math.floor(Math.random() * 15) + 65;
            const currentLatency = Math.floor(Math.random() * 80) + 12;

            if(document.getElementById('cpu-text')) document.getElementById('cpu-text').innerText = `${currentCpu}%`;
            if(document.getElementById('ram-text')) document.getElementById('ram-text').innerText = `${currentRam}%`;
            if(document.getElementById('latency-text')) document.getElementById('latency-text').innerText = `${currentLatency}ms`;

            cpuData.shift(); cpuData.push(currentCpu);
            ramData.shift(); ramData.push(currentRam);
            metricsChart.update('none');

            if(Math.random() > 0.3) addLog();
            if(Math.random() > 0.6) updateTraces();
        }, 1500);

        for(let i=0; i<6; i++) { addLog(); }
        updateTraces();
    </script>
</body>
</html>
